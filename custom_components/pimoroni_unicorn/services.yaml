send_notification:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: pimoroni_unicorn
          multiple: true
    message:
      selector:
        text: {}
    icon:
      selector:
        text: {}
    color:
      selector:
        color_rgb: {}
    appearance:
      collapsed: true
      fields:
        font:
          required: true
          default: bitmap8
          selector:
            select:
              options:
                - {value: bitmap8, label: Standard}
                - {value: heavy, label: Heavy}
                - {value: font5x9, label: Tall}
                - {value: font3x5, label: Compact}
        bold:
          required: true
          default: false
          selector:
            boolean: {}
        outlined:
          required: true
          default: false
          selector:
            boolean: {}
        bg_color:
          selector:
            color_rgb: {}
        icon_scale:
          selector:
            number:
              min: 1
              max: 4
              step: 1
              mode: slider
        icon_position:
          selector:
            select:
              options:
                - {value: left, label: Left}
                - {value: center, label: Center}
                - {value: right, label: Right}
        effect:
          selector:
            select:
              options:
                - {value: rainbow, label: Rainbow}
                - {value: fire, label: Fire}
                - {value: matrix, label: Matrix}
                - {value: scanner, label: Scanner}
                - {value: comet, label: Comet}
                - {value: snow, label: Snow}
                - {value: confetti, label: Confetti}
                - {value: flash, label: Flash}
                - {value: pulse, label: Pulse}
                - {value: bounce, label: Bounce}
                - {value: supercomputer, label: Supercomputer}
                - {value: retroprompt, label: Retro prompt}
        entrance:
          selector:
            select:
              options:
                - {value: "none", label: "None"}
                - {value: swipe_left, label: Swipe from left}
                - {value: swipe_right, label: Swipe from right}
                - {value: slide_left, label: Slide in from left}
                - {value: slide_right, label: Slide in from right}
                - {value: center_out, label: Center out}
                - {value: fade, label: Fade in}
    behaviour:
      collapsed: true
      fields:
        sound:
          selector:
            select:
              options:
                - {value: beep, label: Beep}
                - {value: chime, label: Chime}
                - {value: alert, label: Alert}
        hold:
          required: true
          default: false
          selector:
            boolean: {}
        stack:
          required: true
          default: false
          selector:
            boolean: {}
        wakeup:
          required: true
          default: false
          selector:
            boolean: {}
    timing:
      collapsed: true
      fields:
        duration:
          selector:
            number:
              min: 1
              max: 60
              step: 0.5
              unit_of_measurement: s
        repeat:
          selector:
            number:
              min: 1
              max: 10
              step: 1
        scroll_speed:
          selector:
            number:
              min: 0.1
              max: 5
              step: 0.1
        effect_speed:
          selector:
            number:
              min: 0.1
              max: 5
              step: 0.1

dismiss_notification:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: pimoroni_unicorn
          multiple: true
    all:
      required: true
      default: false
      selector:
        boolean: {}

push_firmware:
  fields:
    device_id:
      selector:
        device:
          integration: pimoroni_unicorn
    files:
      default:
        - main
      selector:
        select:
          multiple: true
          custom_value: true
          options:
            - main
            - drawing
            - notify_animations
            - icons
            - sounds
            - weather_fx
            - bitfonts
            - monospace_digits
            - monospace_big_digits
    file_content:
      selector:
        object: {}

show_page:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: pimoroni_unicorn
    index:
      selector:
        number:
          min: 0
          max: 32
          mode: box
    name:
      selector:
        text: {}
    clear:
      selector:
        boolean: {}

set_playlist:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: pimoroni_unicorn
    pages:
      required: true
      selector:
        text:
          multiple: true
    dwell:
      selector:
        number:
          min: 1
          max: 600
          mode: box
    transition:
      selector:
        select:
          options:
            - none
            - fade
