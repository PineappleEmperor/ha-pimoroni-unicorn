name: Python Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"   # HA's minimum; a matrix here would rename the
                                 # check-run to `lint-and-type (3.14)` and the
                                 # ruleset's required context would never report
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install homeassistant ruff pyright
          [ -f requirements.test.txt ] && pip install -r requirements.test.txt || true
      - name: Ruff
        run: ruff check custom_components/
      - name: Pyright
        run: python -m pyright custom_components/
      # Repo-specific, beyond the skill template: the coverage floor is measured on the
      # HA-side suite only. tests/firmware drives MicroPython stubs and would dilute it.
      - name: Pytest
        run: |
          if [ ! -f requirements.test.txt ]; then
            echo "::error::tests/ exists but requirements.test.txt is missing"
            exit 1
          fi
          pytest tests/integration tests/test_render_service.py tests/test_first_frame_png.py \
                 tests/test_lametric.py tests/test_marketplace.py \
                 --cov=custom_components/pimoroni_unicorn --cov-fail-under=95 -q
          pytest tests/firmware tests/test_manifest_gate.py tests/test_commit_summary.py \
                 tests/test_release_notes.py tests/test_engine_bump_gate.py -q

      # The one-render-path invariant: firmware/ is the source, render/ and catalog/ are
      # generated from it. CLAUDE.md treats these three as non-negotiable.
      - name: Check render/ is in sync with firmware/
        run: python scripts/check_render_sync.py

      - name: Check widget boxes match rendered output
        run: python scripts/check_widget_boxes.py

      - name: Check engine file manifest is complete
        run: python scripts/check_engine_manifest.py
